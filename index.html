<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep 100 - 100 Breaths to Sleep</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #08080e;
            --surface: #12121a;
            --text: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-tertiary: #757578;
            --border: #42424a;
            --border-active: #6366f1;
            --accent: #6366f1;
            --accent-dim: rgba(99, 102, 241, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            flex-direction: column;
            position: relative;
        }

        /* SCREENS */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* HOME SCREEN */
        .home-screen {
            text-align: center;
            gap: 32px;
        }

        .title {
            font-size: 48px;
            font-weight: 200;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .start-btn {
            padding: 14px 48px;
            border-radius: 100px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(167, 139, 250, 0.1));
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.1);
        }

        /* COUNT SCREEN */
        .count-screen {
            flex-direction: column;
            gap: 48px;
        }

        .count-display {
            text-align: center;
        }

        .count-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .count-number {
            font-size: 180px;
            font-weight: 100;
            letter-spacing: -4px;       line-height: 1;
        }

        .count-subtext {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        .bottom-controls {
            display: flex;
            gap: 16px;
            bottom: 80px;
            position: fixed;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            border-color: var(--border-active);
            color: var(--accent);
        }

        /* END SCREEN */
        .end-screen {
            flex-direction: column;
            gap: 32px;
            text-align: center;
        }

        .end-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .end-text {
            font-size: 24px;
            font-weight: 200;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .end-subtext {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .restart-btn {
            padding: 14px 48px;
            border-radius: 100px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            background: var(--accent-dim);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }

        .restart-btn:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        /* Bottom banner */
        .bottom-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 48px; background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            gap: 8px; z-index: 100; backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer; transition: opacity 0.3s ease;
        }
        .bottom-banner.hidden { display: none; }
        .bottom-banner-text {
            font-size: 11px; font-weight: 300; color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .bottom-banner-app {
            font-size: 11px; font-weight: 400; color: var(--accent);
        }
        .bottom-banner-close {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-tertiary);
            font-size: 16px; cursor: pointer; padding: 4px 8px;
        }

        /* Payment popup overlay */
        .popup-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .popup-overlay.active { opacity: 1; visibility: visible; }
        .popup-card {
            background: #12121a; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 36px 32px; max-width: 320px;
            width: 90%; text-align: center;
        }
        .popup-title {
            font-size: 18px; font-weight: 300; color: var(--text);
            margin-bottom: 8px;
        }
        .popup-desc {
            font-size: 13px; font-weight: 300; color: var(--text-secondary);
            margin-bottom: 24px; line-height: 1.5;
        }
        .popup-btn-primary {
            display: block; width: 100%; padding: 14px; border-radius: 100px;
            border: 1px solid rgba(99,102,241,0.3);
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(167,139,250,0.1));
            color: var(--text); font-family: inherit; font-size: 13px;
            font-weight: 400; letter-spacing: 1px; cursor: pointer;
            transition: all 0.3s ease; margin-bottom: 12px;
        }
        .popup-btn-primary:hover {
            border-color: rgba(99,102,241,0.5);
            box-shadow: 0 0 30px rgba(99,102,241,0.1);
        }
        .popup-btn-secondary {
            background: none; border: none; color: var(--text-tertiary);
            font-family: inherit; font-size: 12px; cursor: pointer;
            padding: 8px; letter-spacing: 1px;
        }

        /* Email form on end screen */
        .email-form {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; margin-top: 32px; opacity: 0;
            animation: endFadeIn 2s 1s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        .email-form.hidden { display: none; }
        .email-label {
            font-size: 11px; font-weight: 300; color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .email-row { display: flex; gap: 8px; }
        .email-input {
            padding: 10px 16px; border-radius: 100px; width: 200px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); font-family: inherit; font-size: 12px;
            outline: none; transition: border-color 0.3s ease;
        }
        .email-input:focus { border-color: var(--border-active); }
        .email-submit {
            padding: 10px 20px; border-radius: 100px;
            border: 1px solid rgba(99,102,241,0.25);
            background: var(--accent-dim); color: var(--text);
            font-family: inherit; font-size: 11px; font-weight: 400;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px;
        }
        .email-submit:hover { border-color: rgba(99,102,241,0.4); }
        .email-thanks {
            font-size: 11px; color: var(--accent); letter-spacing: 1px;
            font-weight: 300;
        }

        /* PWA install banner */
        .install-banner {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #12121a; border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px; padding: 14px 20px; z-index: 150;
            display: flex; align-items: center; gap: 12px;
            opacity: 0; visibility: hidden; transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .install-banner.active { opacity: 1; visibility: visible; }
        .install-banner-text {
            font-size: 12px; font-weight: 300; color: var(--text-secondary);
        }
        .install-banner-btn {
            padding: 8px 16px; border-radius: 100px;
            border: 1px solid rgba(99,102,241,0.3);
            background: var(--accent-dim); color: var(--text);
            font-family: inherit; font-size: 11px; cursor: pointer;
            white-space: nowrap;
        }
        .install-banner-close {
            background: none; border: none; color: var(--text-tertiary);
            font-size: 14px; cursor: pointer; padding: 2px 6px;
        }

        @keyframes endFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 32px;
            }
            .count-number {
                font-size: 120px;
            }
            .email-input {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HOME SCREEN -->
        <div class="screen home-screen active" id="home-screen">
            <div>
                <h1 class="title">Sleep 100</h1>
                <p class="subtitle">100 deep breaths to sleep</p>
            </div>
            <button class="start-btn" id="start-btn">Start Countdown</button>
        </div>

        <!-- COUNT SCREEN -->
        <div class="screen count-screen" id="count-screen">
            <div class="count-display">
                <div class="count-label">Breath</div>
                <div class="count-number" id="count-number">0</div>
                <p class="count-subtext">Breathe in for 4, hold for 4, out for 4</p>
            </div>
            <div class="bottom-controls">
                <button class="control-btn" id="pause-btn" title="Pause">â¸</button>
                <button class="control-btn" id="stop-btn" title="Stop">â</button>
            </div>
        </div>

        <!-- END SCREEN -->
        <div class="screen end-screen" id="end-screen">
            <div>
                <div class="end-icon">â</div>
                <h2 class="end-text">Good night</h2>
                <p class="end-subtext">You've completed 100 breaths</p>
            </div>
            <button class="restart-btn" id="restart-btn">Start Again</button>
            <div class="email-form" id="email-form">
                <div class="email-label">Want to know when we launch new apps?</div>
                <div class="email-row">
                    <input type="email" class="email-input" id="email-input" placeholder="your@email.com">
                    <button class="email-submit" id="email-submit">Notify me</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM BANNER (cross-promo) -->
    <div class="bottom-banner" id="bottom-banner">
        <span class="bottom-banner-text">Try our new app</span>
        <span class="bottom-banner-app">Breathe Now â</span>
        <button class="bottom-banner-close" id="banner-close">Ã</button>
    </div>

    <!-- PAYMENT POPUP -->
    <div class="popup-overlay" id="payment-popup">
        <div class="popup-card">
            <div class="popup-title">Enjoying Sleep 100?</div>
            <div class="popup-desc">Go ad-free for $1.99</div>
            <a class="popup-btn-primary" id="payment-btn" href="#" target="_blank">Remove Ads â $1.99 forever</a>
            <button class="popup-btn-secondary" id="popup-dismiss">Not now</button>
        </div>
    </div>

    <!-- PWA INSTALL BANNER -->
    <div class="install-banner" id="install-banner">
        <span class="install-banner-text">Add to home screen</span>
        <button class="install-banner-btn" id="install-btn">Install</button>
        <button class="install-banner-close" id="install-close">Ã</button>
    </div>

    <script>
        // ===== STATE =====
        let currentCount = 0;
        let isRunning = false;
        let isPaused = false;
        let timerId = null;

        // ===== DOM ELEMENTS =====
        const homeScreen = document.getElementById('home-screen');
        const countScreen = document.getElementById('count-screen');
        const endScreen = document.getElementById('end-screen');
        const countNumber = document.getElementById('count-number');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const restartBtn = document.getElementById('restart-btn');

        // ===== SCREEN TRANSITIONS =====
        function showScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            screen.classList.add('active');
        }

        // ===== COUNTDOWN LOGIC =====
        async function startCountdown() {
            incrementUseCount();
            currentCount = 0;
            isRunning = true;
            isPaused = false;
            showScreen(countScreen);

            while (currentCount < 100 && isRunning) {
                if (!isPaused) {
                    currentCount++;
                    countNumber.textContent = currentCount;

                    // Haptic feedback if available
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                }

                // Wait 12 seconds per breath (4 in, 4 hold, 4 out)
                await new Promise(resolve => {
                    timerId = setTimeout(resolve, 12000);
                });
            }

            if (isRunning) {
                endCountdown();
            }
        }

        function pauseCountdown() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'â¶' : 'â¸';
        }

        function stopCountdown() {
            isRunning = false;
            clearTimeout(timerId);
            showScreen(homeScreen);
            pauseBtn.textContent = 'â¸';
        }

        function endCountdown() {
            isRunning = false;
            showScreen(endScreen);
        }

        // ===== EVENT LISTENERS =====
        startBtn.addEventListener('click', startCountdown);
        pauseBtn.addEventListener('click', pauseCountdown);
        stopBtn.addEventListener('click', stopCountdown);
        restartBtn.addEventListener('click', startCountdown);

        // ===== MONETIZATION & ANALYTICS =====

        // Check paid status
        const isPaid = localStorage.getItem('paid') === 'true';
        // Check URL params for payment callback
        (function checkPaymentCallback() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('paid') === 'true') {
                localStorage.setItem('paid', 'true');
                window.history.replaceState({}, '', window.location.pathname);
                location.reload();
            }
        })();

        // ===== BOTTOM BANNER =====
        const bottomBanner = document.getElementById('bottom-banner');
        const bannerClose = document.getElementById('banner-close');
        if (isPaid) {
            bottomBanner.classList.add('hidden');
        } else {
            bannerClose.addEventListener('click', (e) => {
                e.stopPropagation();
                bottomBanner.classList.add('hidden');
            });
            bottomBanner.addEventListener('click', () => {
                // Link to other SystemLab app when available
                // window.open('https://breathenow.pages.dev', '_blank');
            });
        }

        // ===== PAYMENT POPUP (every 3 uses) =====
        const paymentPopup = document.getElementById('payment-popup');
        const paymentBtn = document.getElementById('payment-btn');
        const popupDismiss = document.getElementById('popup-dismiss');

        // TODO: Replace with actual LemonSqueezy checkout URL
        paymentBtn.href = 'https://sleep100.lemonsqueezy.com/checkout';

        function incrementUseCount() {
            if (isPaid) return;
            let count = parseInt(localStorage.getItem('useCount') || '0');
            count++;
            localStorage.setItem('useCount', count.toString());
            if (count % 3 === 0) {
                setTimeout(() => {
                    paymentPopup.classList.add('active');
                }, 1500);
            }
        }

        popupDismiss.addEventListener('click', () => {
            paymentPopup.classList.remove('active');
        });
        paymentPopup.addEventListener('click', (e) => {
            if (e.target === paymentPopup) paymentPopup.classList.remove('active');
        });

        // Hook into startCountdown to track usage
        const _origStartCountdown = startCountdown;
        window.startCountdown = async function() {
            incrementUseCount();
            await _origStartCountdown();
        };

        // ===== EMAIL COLLECTION =====
        const emailForm = document.getElementById('email-form');
        const emailInput = document.getElementById('email-input');
        const emailSubmitBtn = document.getElementById('email-submit');

        if (localStorage.getItem('emailSubmitted') === 'true') {
            emailForm.classList.add('hidden');
        }

        emailSubmitBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) return;

            // Send to Google Apps Script
            const GAS_URL = 'https://script.google.com/macros/s/PLACEHOLDER/exec';
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, app: 'sleep100', timestamp: new Date().toISOString() })
            }).catch(() => {});

            localStorage.setItem('emailSubmitted', 'true');          emailForm.innerHTML = '<div class="email-thanks">Thanks! We\'ll let you know.</div>';
        });

        // ===== PWA INSTALL =====
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const useCount = parseInt(localStorage.getItem('useCount') || '0');
            if (useCount >= 3 && !localStorage.getItem('installDismissed')) {
                document.getElementById('install-banner').classList.add('active');
            }
        });

        document.getElementById('install-btn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('install-banner').classList.remove('active');
                });
            }
        });

        document.getElementById('install-close').addEventListener('click', () => {
            document.getElementById('install-banner').classList.remove('active');
            localStorage.setItem('installDismissed', 'true');
        });

        // ===== SERVICE WORKER REGISTRATION =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
