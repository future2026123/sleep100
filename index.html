<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#08080e">
    <title>Sleep 100</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --bg: #08080e;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.06);
            --border-active: rgba(255,255,255,0.15);
            --text: #e4e6f0;
            --text-secondary: rgba(255,255,255,0.35);
            --text-tertiary: rgba(255,255,255,0.18);
            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.15);
            --accent-glow: rgba(99,102,241,0.08);
            --warm: #a78bfa;
        }

        html, body {
            height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: 'Inter', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Ambient background glow */
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 50% 40%, rgba(99,102,241,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 30% 70%, rgba(167,139,250,0.02) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        /* Subtle noise texture */
        body::after {
            content: ''; position: fixed; inset: 0; opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
        }

        /* ===== SCREENS ===== */
        .screen {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), visibility 0.8s;
            opacity: 0; visibility: hidden; z-index: 1;
        }
        .screen.active { opacity: 1; visibility: visible; }

        /* ===== READY SCREEN ===== */
        #ready-screen { gap: 52px; }

        .ready-number {
            font-size: clamp(120px, 22vw, 200px); font-weight: 100;
            color: var(--text); letter-spacing: -6px; line-height: 1;
            opacity: 0.9; text-shadow: 0 0 80px rgba(99,102,241,0.08);
        }

        .options { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 340px; }
        .option-group { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .option-label { font-size: 10px; font-weight: 400; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); }
        .option-pills { display: flex; gap: 8px; }

        .pill {
            padding: 10px 24px; border-radius: 100px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-secondary);
            font-family: 'Inter', 'Pretendard Variable', sans-serif;
            font-size: 13px; font-weight: 300; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .pill:hover { border-color: var(--border-active); color: var(--text); background: var(--surface-hover); }
        .pill.selected {
            background: var(--accent-dim); border-color: rgba(99,102,241,0.3);
            color: var(--text); font-weight: 400;
            box-shadow: 0 0 20px rgba(99,102,241,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .start-btn {
            margin-top: 12px; width: 180px; height: 52px; border-radius: 100px;
            border: 1px solid rgba(99,102,241,0.25);
            background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(167,139,250,0.08));
            color: var(--text);
            font-family: 'Inter', 'Pretendard Variable', sans-serif;
            font-size: 13px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: relative; overflow: hidden;
        }
        .start-btn::before {
            content: ''; position: absolute; inset: 0; border-radius: 100px;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(167,139,250,0.1));
            opacity: 0; transition: opacity 0.4s ease;
        }
        .start-btn:hover::before { opacity: 1; }
        .start-btn:hover { border-color: rgba(99,102,241,0.4); box-shadow: 0 0 40px rgba(99,102,241,0.1); transform: translateY(-1px); }
        .start-btn:active { transform: scale(0.97) translateY(0); }

        /* ===== COUNT SCREEN ===== */
        #count-screen { cursor: pointer; }

        .count-number {
            font-size: clamp(140px, 28vw, 240px); font-weight: 100;
            color: var(--text); letter-spacing: -6px; line-height: 1;
            transition: opacity 0.4s cubic-bezier(0.4,0,0.2,1), transform 0.4s cubic-bezier(0.4,0,0.2,1);
            text-shadow: 0 0 100px rgba(99,102,241,0.06); position: relative;
        }
        .count-number.fade-out { opacity: 0; transform: translateY(12px) scale(0.98); }

        /* Progress ring */
        .progress-ring-container { position: absolute; width: 340px; height: 340px; pointer-events: none; }
        .progress-ring { transform: rotate(-90deg); }
        .progress-ring-bg { fill: none; stroke: rgba(255,255,255,0.03); stroke-width: 1; }
        .progress-ring-fill {
            fill: none; stroke: url(#progressGradient); stroke-width: 1.5; stroke-linecap: round;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);
        }

        .paused-indicator {
            position: absolute; top: 48px;
            font-size: 11px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            color: var(--text-secondary); opacity: 0; transition: opacity 0.4s ease;
        }
        .paused-indicator.visible { opacity: 1; }

        /* Breathing dot indicator */
        .breathing-dot {
            position: absolute; top: 80px; width: 4px; height: 4px; border-radius: 50%;
            background: var(--accent); opacity: 0; transition: opacity 0.4s ease;
        }
        .breathing-dot.active { opacity: 1; animation: breathe 4s ease-in-out infinite; }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); box-shadow: 0 0 8px rgba(99,102,241,0.3); }
            50% { opacity: 0.8; transform: scale(1.5); box-shadow: 0 0 16px rgba(99,102,241,0.5); }
        }

        .bottom-controls {
            position: absolute; bottom: 32px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            padding: 20px 28px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .control-row { display: flex; align-items: center; gap: 14px; }
        .volume-row { display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity 0.4s ease; }
        .volume-row.visible { opacity: 1; }

        .volume-label, .control-label {
            font-size: 9px; font-weight: 400; color: var(--text-secondary);
            letter-spacing: 2px; text-transform: uppercase; min-width: 44px; text-align: right;
        }

        .pill-small {
            padding: 6px 16px; border-radius: 100px;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text-secondary);
            font-family: 'Inter', 'Pretendard Variable', sans-serif;
            font-size: 11px; font-weight: 300; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .pill-small:hover { border-color: var(--border-active); color: var(--text); }
        .pill-small.selected {
            background: var(--accent-dim); border-color: rgba(99,102,241,0.3);
            color: var(--text); font-weight: 400;
        }

        /* Custom range slider */
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100px; height: 2px; border-radius: 1px;
            background: linear-gradient(90deg, rgba(99,102,241,0.3), rgba(167,139,250,0.15));
            outline: none; opacity: 0.8; transition: opacity 0.3s ease;
        }
        input[type="range"]:hover { opacity: 1; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--text); cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
            transition: transform 0.2s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* ===== END SCREEN ===== */
        #end-screen { cursor: pointer; }

        .end-text {
            font-size: clamp(28px, 5vw, 44px); font-weight: 200; letter-spacing: 6px;
            color: var(--text); opacity: 0;
            animation: endFadeIn 2s cubic-bezier(0.4,0,0.2,1) forwards;
            text-shadow: 0 0 60px rgba(167,139,250,0.1);
        }

        @keyframes endFadeIn {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); letter-spacing: 12px; }
            100% { opacity: 0.8; transform: translateY(0) scale(1); letter-spacing: 6px; }
        }

        .moon-icon {
            position: absolute; top: calc(50% - 100px); width: 32px; height: 32px;
            opacity: 0; animation: moonFade 2.5s 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
        }

        @keyframes moonFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 0.25; transform: translateY(0); }
        }

        .slogan { position: absolute; bottom: 28px; font-size: 10px; font-weight: 300; letter-spacing: 2px; color: var(--text-tertiary); }

        @media (max-height: 700px) {
            .bottom-controls { bottom: 16px; gap: 10px; padding: 14px 20px 12px; }
            .progress-ring-container { width: 280px; height: 280px; }
            #ready-screen { gap: 36px; }
        }
        @media (max-width: 420px) {
            .ready-number { letter-spacing: -4px; }
            .count-number { letter-spacing: -4px; }
            .bottom-controls { padding: 16px 20px 12px; }
        }
    </style>
</head>
<body>

    <!-- READY SCREEN -->
    <div id="ready-screen" class="screen active">
        <div class="ready-number">100</div>
        <div class="options">
            <div class="option-group">
                <div class="option-label">Interval</div>
                <div class="option-pills" id="interval-pills">
                    <button class="pill" data-value="3">3s</button>
                    <button class="pill selected" data-value="5">5s</button>
                    <button class="pill" data-value="7">7s</button>
                </div>
            </div>
            <div class="option-group">
                <div class="option-label">Repeat</div>
                <div class="option-pills" id="loop-pills">
                    <button class="pill selected" data-value="1">1회</button>
                    <button class="pill" data-value="3">3회</button>
                    <button class="pill" data-value="5">5회</button>
                    <button class="pill" data-value="0">무한</button>
                </div>
            </div>
            <button class="start-btn" id="start-btn">Start</button>
        </div>
        <div class="slogan">Count down. Fall asleep.</div>
    </div>

    <!-- COUNT SCREEN -->
    <div id="count-screen" class="screen">
        <div class="paused-indicator" id="paused-indicator">Paused</div>
        <div class="breathing-dot" id="breathing-dot"></div>
        <div class="progress-ring-container">
            <svg class="progress-ring" width="100%" height="100%" viewBox="0 0 340 340">
                <defs>
                    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
                        <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
                <circle class="progress-ring-bg" cx="170" cy="170" r="165"/>
                <circle class="progress-ring-fill" id="progress-ring" cx="170" cy="170" r="165" stroke-dasharray="1036.73" stroke-dashoffset="0"/>
            </svg>
        </div>
        <div class="count-number" id="count-number">100</div>
        <div class="bottom-controls">
            <div class="control-row" id="speed-row">
                <span class="control-label">Speed</span>
                <div class="speed-pills" id="speed-pills">
                    <button class="pill-small" data-value="3">3s</button>
                    <button class="pill-small selected" data-value="5">5s</button>
                    <button class="pill-small" data-value="7">7s</button>
                </div>
            </div>
            <div class="control-row">
                <span class="control-label">Sound</span>
                <div class="noise-pills" id="noise-pills">
                    <button class="pill-small selected" data-noise="rain">Rain</button>
                    <button class="pill-small" data-noise="ocean">Ocean</button>
                    <button class="pill-small" data-noise="none">None</button>
                </div>
            </div>
            <div class="volume-row visible" id="voice-volume-row">
                <span class="volume-label">Voice</span>
                <input type="range" id="voice-volume" min="0" max="100" value="80">
            </div>
            <div class="volume-row visible" id="noise-volume-row">
                <span class="volume-label">Noise</span>
                <input type="range" id="noise-volume" min="0" max="100" value="40">
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        </svg>
        <div class="end-text">Good night.</div>
    </div>

<script>
// ===== NUMBER TO WORDS =====
function numberToWords(n) {
    const ones = ['','one','two','three','four','five','six','seven','eight','nine','ten',
        'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    if (n === 0) return 'zero';
    if (n === 100) return 'one hundred';
    if (n < 20) return ones[n];
    if (n % 10 === 0) return tens[Math.floor(n / 10)];
    return tens[Math.floor(n / 10)] + ' ' + ones[n % 10];
}

const state = {
    interval: 5, loops: 1, currentLoop: 0, currentNumber: 100,
    isPaused: false, isRunning: false, noiseType: 'rain',
    voiceVolume: 0.8, noiseVolume: 0.4, wakeLock: null, countTimer: null, mp3Available: false,
};

let dropletInterval = null;

const readyScreen = document.getElementById('ready-screen');
const countScreen = document.getElementById('count-screen');
const endScreen = document.getElementById('end-screen');
const countNumber = document.getElementById('count-number');
const pausedIndicator = document.getElementById('paused-indicator');
const breathingDot = document.getElementById('breathing-dot');
const progressRing = document.getElementById('progress-ring');
const startBtn = document.getElementById('start-btn');
const voiceVolumeSlider = document.getElementById('voice-volume');
const noiseVolumeSlider = document.getElementById('noise-volume');

const RING_CIRCUMFERENCE = 2 * Math.PI * 165;
function updateProgress(n) {
    const pct = (100 - n) / 100;
    progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - pct);
}

let speechSynth = window.speechSynthesis;
let selectedVoice = null;
function initSpeechVoices() {
    const voices = speechSynth.getVoices();
    const preferred = ['Samantha','Karen','Victoria','Fiona','Google UK English Female','Microsoft Zira'];
    for (const name of preferred) {
        const v = voices.find(voice => voice.name.includes(name) && voice.lang.startsWith('en'));
        if (v) { selectedVoice = v; break; }
    }
    if (!selectedVoice) selectedVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
}
speechSynth.onvoiceschanged = initSpeechVoices;
initSpeechVoices();

function speakNumber(n) {
    return new Promise((resolve) => {
        if (!speechSynth || state.isPaused) { resolve(); return; }
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(numberToWords(n));
        utterance.rate = 0.8; utterance.pitch = 0.9; utterance.volume = state.voiceVolume;
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.onend = resolve; utterance.onerror = resolve;
        speechSynth.speak(utterance);
        setTimeout(resolve, 4000);
    });
}

const audioCache = {};
let voiceAudio = null;
function checkMp3Available() {
    return new Promise((resolve) => {
        const test = new Audio('audio/100.mp3');
        test.oncanplaythrough = () => resolve(true);
        test.onerror = () => resolve(false);
        setTimeout(() => resolve(false), 2000);
    });
}
function preloadRange(from, to) {
    for (let i = from; i >= to && i >= 0; i--) {
        if (!audioCache[i]) { const a = new Audio('audio/' + i + '.mp3'); a.preload = 'auto'; audioCache[i] = a; }
    }
}
function playMp3(n) {
    return new Promise((resolve) => {
        const audio = audioCache[n] || new Audio('audio/' + n + '.mp3');
        voiceAudio = audio; audio.currentTime = 0; audio.volume = state.voiceVolume;
        audio.play().catch(() => {}); audio.onended = resolve; audio.onerror = resolve;
        setTimeout(resolve, 4000);
    });
}
async function playVoice(n) { if (state.mp3Available) await playMp3(n); else await speakNumber(n); }

let audioContext = null;
let noiseNodes = [];
let noiseGainNode = null;

async function initAudioContext() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') await audioContext.resume();
}

function createWhiteNoiseBuffer(seconds) {
    const sr = audioContext.sampleRate; const len = sr * seconds;
    const buf = audioContext.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) { const data = buf.getChannelData(ch); for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1; }
    return buf;
}

function createPinkNoiseBuffer(seconds) {
    const sr = audioContext.sampleRate; const len = sr * seconds;
    const buf = audioContext.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
        for (let i = 0; i < len; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886*b0 + white*0.0555179;
            b1 = 0.99332*b1 + white*0.0750759;
            b2 = 0.96900*b2 + white*0.1538520;
            b3 = 0.86650*b3 + white*0.3104856;
            b4 = 0.55000*b4 + white*0.5329522;
            b5 = -0.7616*b5 - white*0.0168980;
            data[i] = (b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11;
            b6 = white*0.115926;
        }
    }
    return buf;
}

function startRain() {
    const master = audioContext.createGain();
    master.gain.value = state.noiseVolume;
    master.connect(audioContext.destination);
    noiseGainNode = master;

    const pinkBuf = createPinkNoiseBuffer(4);
    const pinkSrc = audioContext.createBufferSource();
    pinkSrc.buffer = pinkBuf; pinkSrc.loop = true;
    const pinkLP = audioContext.createBiquadFilter();
    pinkLP.type = 'lowpass'; pinkLP.frequency.value = 2500; pinkLP.Q.value = 0.5;
    const pinkGain = audioContext.createGain(); pinkGain.gain.value = 0.15;
    pinkSrc.connect(pinkLP); pinkLP.connect(pinkGain); pinkGain.connect(master);
    pinkSrc.start(0);
    noiseNodes.push(pinkSrc, pinkLP, pinkGain);

    function createDroplet() {
        if (!audioContext || audioContext.state === 'closed') return;
        const now = audioContext.currentTime;
        const duration = 0.03;
        const bufLen = Math.ceil(audioContext.sampleRate * duration);
        const dropBuf = audioContext.createBuffer(1, bufLen, audioContext.sampleRate);
        const data = dropBuf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) {
            const env = Math.exp(-i / (bufLen * 0.2));
            data[i] = (Math.random() * 2 - 1) * env;
        }
        const src = audioContext.createBufferSource(); src.buffer = dropBuf;
        const bp = audioContext.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 2000 + Math.random() * 6000;
        bp.Q.value = 1.5 + Math.random() * 2;
        const pan = audioContext.createStereoPanner();
        pan.pan.value = Math.random() * 2 - 1;
        const dropGain = audioContext.createGain();
        dropGain.gain.value = 0.02 + Math.random() * 0.06;
        src.connect(bp); bp.connect(pan); pan.connect(dropGain); dropGain.connect(master);
        src.start(now); src.stop(now + duration + 0.05);
        src.onended = () => { try { src.disconnect(); bp.disconnect(); pan.disconnect(); dropGain.disconnect(); } catch(e) {} };
    }

    dropletInterval = setInterval(() => {
        const dropsThisBatch = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < dropsThisBatch; i++) setTimeout(createDroplet, Math.random() * 80);
    }, 80);
}

function startOcean() {
    const gain = audioContext.createGain(); gain.gain.value = state.noiseVolume;
    gain.connect(audioContext.destination); noiseGainNode = gain;
    const baseBuf = createWhiteNoiseBuffer(5);
    const baseSrc = audioContext.createBufferSource(); baseSrc.buffer = baseBuf; baseSrc.loop = true;
    const baseLP = audioContext.createBiquadFilter(); baseLP.type = 'lowpass'; baseLP.frequency.value = 600; baseLP.Q.value = 0.3;
    baseSrc.connect(baseLP); noiseNodes.push(baseSrc, baseLP);
    const lfo = audioContext.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
    const lfoGain = audioContext.createGain(); lfoGain.gain.value = 0.3;
    lfo.connect(lfoGain); noiseNodes.push(lfo, lfoGain);
    const waveGain = audioContext.createGain(); waveGain.gain.value = 0.6;
    lfoGain.connect(waveGain.gain); baseLP.connect(waveGain); waveGain.connect(gain);
    lfo.start(0); baseSrc.start(0); noiseNodes.push(waveGain);
    const foamBuf = createWhiteNoiseBuffer(3);
    const foamSrc = audioContext.createBufferSource(); foamSrc.buffer = foamBuf; foamSrc.loop = true;
    const foamBP = audioContext.createBiquadFilter(); foamBP.type = 'bandpass'; foamBP.frequency.value = 2000; foamBP.Q.value = 0.5;
    const foamGain = audioContext.createGain(); foamGain.gain.value = 0.12;
    const lfo2 = audioContext.createOscillator(); lfo2.type = 'sine'; lfo2.frequency.value = 0.12;
    const lfo2Gain = audioContext.createGain(); lfo2Gain.gain.value = 0.08;
    lfo2.connect(lfo2Gain); lfo2Gain.connect(foamGain.gain);
    foamSrc.connect(foamBP); foamBP.connect(foamGain); foamGain.connect(gain);
    lfo2.start(0); foamSrc.start(0);
    noiseNodes.push(foamSrc, foamBP, foamGain, lfo2, lfo2Gain);
}

function startNoise(type) { stopNoise(); if (type === 'none') return; if (type === 'rain') startRain(); else if (type === 'ocean') startOcean(); }

function stopNoise() {
    if (dropletInterval) { clearInterval(dropletInterval); dropletInterval = null; }
    noiseNodes.forEach(node => { try { if (node.stop) node.stop(); } catch(e) {} try { node.disconnect(); } catch(e) {} });
    noiseNodes = [];
    if (noiseGainNode) { try { noiseGainNode.disconnect(); } catch(e) {} noiseGainNode = null; }
}

async function requestWakeLock() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') state.wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }
function releaseWakeLock() { if (state.wakeLock) { state.wakeLock.release(); state.wakeLock = null; } }
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && state.isRunning) await requestWakeLock(); });

function showScreen(screen) { [readyScreen, countScreen, endScreen].forEach(s => s.classList.remove('active')); screen.classList.add('active'); }

function setupPills(id, cb, noise) {
    const c = document.getElementById(id); if (!c) return;
    c.querySelectorAll('.pill, .pill-small').forEach(p => {
        p.addEventListener('click', (e) => { e.stopPropagation(); c.querySelectorAll('.pill, .pill-small').forEach(x => x.classList.remove('selected')); p.classList.add('selected'); cb(noise ? p.dataset.noise : p.dataset.value); });
    });
}
function syncSpeedPills(v) { document.querySelectorAll('#speed-pills .pill-small').forEach(p => p.classList.toggle('selected', p.dataset.value === v)); }
function syncIntervalPills(v) { document.querySelectorAll('#interval-pills .pill').forEach(p => p.classList.toggle('selected', p.dataset.value === v)); }

setupPills('interval-pills', v => { state.interval = parseInt(v); syncSpeedPills(v); });
setupPills('loop-pills', v => { state.loops = parseInt(v); });
setupPills('speed-pills', v => { state.interval = parseInt(v); syncIntervalPills(v); });
setupPills('noise-pills', async v => { state.noiseType = v; if (state.isRunning) { if (v === 'none') stopNoise(); else { await initAudioContext(); startNoise(v); } } document.getElementById('noise-volume-row').classList.toggle('visible', v !== 'none'); }, true);

voiceVolumeSlider.addEventListener('input', e => { e.stopPropagation(); state.voiceVolume = e.target.value / 100; });
noiseVolumeSlider.addEventListener('input', e => { e.stopPropagation(); state.noiseVolume = e.target.value / 100; if (noiseGainNode) noiseGainNode.gain.value = state.noiseVolume; });
document.querySelectorAll('.bottom-controls, .bottom-controls *').forEach(el => { el.addEventListener('click', e => e.stopPropagation()); });

function animateNumber(num) { countNumber.classList.add('fade-out'); setTimeout(() => { countNumber.textContent = num; countNumber.classList.remove('fade-out'); }, 220); }

function waitInterval() {
    return new Promise(resolve => {
        let elapsed = 0; const tick = 100;
        function step() { if (!state.isRunning) { resolve(); return; } if (state.isPaused) { state.countTimer = setTimeout(step, tick); return; } elapsed += tick; if (elapsed >= state.interval * 1000) resolve(); else state.countTimer = setTimeout(step, tick); }
        state.countTimer = setTimeout(step, tick);
    });
}

async function startCountdown() {
    state.isRunning = true; state.isPaused = false; state.currentLoop = 0;
    await initAudioContext(); await requestWakeLock();
    state.mp3Available = await checkMp3Available();
    if (state.mp3Available) preloadRange(100, 80);
    if (state.noiseType !== 'none') startNoise(state.noiseType);
    breathingDot.classList.add('active'); updateProgress(100); showScreen(countScreen); runLoop();
}

async function runLoop() {
    for (let n = 100; n >= 0; n--) {
        if (!state.isRunning) return;
        state.currentNumber = n; animateNumber(n); updateProgress(n);
        if (state.mp3Available && n > 0) preloadRange(n - 1, Math.max(0, n - 10));
        await playVoice(n); if (!state.isRunning) return;
        await waitInterval(); if (!state.isRunning) return;
    }
    state.currentLoop++;
    if (state.loops === 0 || state.currentLoop < state.loops) runLoop(); else endSession();
}

countScreen.addEventListener('click', () => {
    if (!state.isRunning) return;
    state.isPaused = !state.isPaused;
    pausedIndicator.classList.toggle('visible', state.isPaused);
    breathingDot.classList.toggle('active', !state.isPaused);
    if (state.isPaused) { speechSynth.pause(); if (voiceAudio) voiceAudio.pause(); if (noiseGainNode) noiseGainNode.gain.linearRampToValueAtTime(state.noiseVolume * 0.3, audioContext.currentTime + 0.5); }
    else { speechSynth.resume(); if (voiceAudio) voiceAudio.play().catch(() => {}); if (noiseGainNode) noiseGainNode.gain.linearRampToValueAtTime(state.noiseVolume, audioContext.currentTime + 0.5); }
});

function endSession() {
    state.isRunning = false; clearTimeout(state.countTimer); speechSynth.cancel();
    stopNoise(); releaseWakeLock(); breathingDot.classList.remove('active');
    showScreen(endScreen); setTimeout(() => { if (!state.isRunning) showScreen(readyScreen); }, 10000);
}

endScreen.addEventListener('click', () => showScreen(readyScreen));
startBtn.addEventListener('click', () => startCountdown());
</script>
